name: Deploy preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Install project pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies and pnpm-managed Node.js
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Build and deploy the branch preview
        run: pnpm deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
