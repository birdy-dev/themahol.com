name: Deploy to Cloudflare
run-name: Deploy ${{ github.ref_name }} to production

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.release.prerelease == false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Install project pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies and pnpm-managed Node.js
        run: pnpm install --frozen-lockfile

      - name: Validate the release version
        run: |
          pnpm exec node --input-type=module -e '
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(process.env.GITHUB_REF_NAME)) {
              throw new Error("Production releases must use a vMAJOR.MINOR.PATCH tag, such as v1.2.3");
            }
          '

      - name: Check, build, and deploy the production Worker
        run: pnpm deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
